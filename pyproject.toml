[project]
name = "outlook-masive-emails"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "extract-msg",
    "fastapi",
    "pandas",
    "python-dotenv",
    "python-multipart",
    "pywin32; sys_platform == 'win32'",
    "requests",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ruff>=0.17.3",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    ".",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
